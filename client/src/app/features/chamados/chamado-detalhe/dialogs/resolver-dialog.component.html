<h2 mat-dialog-title>Resolver chamado</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="campo-largo">
      <mat-label>Nota de resolução</mat-label>
      <textarea matInput formControlName="notaResolucao" rows="4"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]>Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="confirmar()">Confirmar</button>
</mat-dialog-actions>
