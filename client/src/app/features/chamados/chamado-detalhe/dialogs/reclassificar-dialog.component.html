<h2 mat-dialog-title>Reclassificar prioridade</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline">
      <mat-label>Nova prioridade</mat-label>
      <mat-select formControlName="novaPrioridade">
        @for (opcao of opcoesPrioridade; track opcao.valor) {
          <mat-option [value]="opcao.valor">{{ opcao.rotulo }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]>Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="confirmar()">Confirmar</button>
</mat-dialog-actions>
