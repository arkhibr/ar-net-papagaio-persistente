<h1>Categorias de serviço</h1>

@if (carregando()) {
  <mat-spinner diameter="32" />
} @else {
  <div class="surface-card sem-padding">
    <table mat-table [dataSource]="categorias()">
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let categoria">{{ categoria.nome }}</td>
      </ng-container>
      <ng-container matColumnDef="equipeId">
        <th mat-header-cell *matHeaderCellDef>Equipe</th>
        <td mat-cell *matCellDef="let categoria">{{ categoria.equipeId }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas"></tr>
    </table>

    @if (categorias().length === 0) {
      <p class="vazio">Nenhuma categoria cadastrada — popule via seed manual (ver testes-manuais.md).</p>
    }
  </div>
}
